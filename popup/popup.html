<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>GlassVeil - Personal Element Blocker</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="popup-layout">
        <header>
            <div class="logo-area">
                <span class="brand-icon-frame"><img class="brand-icon" src="../icons/icon-128.png" alt="" /></span>
                <h1>Glass<span>Veil</span></h1>
                <span class="status-badge version-badge" id="extension-version" title="Extension version"></span>
            </div>
            <div class="header-actions">
                <button class="btn-text icon-button" id="shortcut-settings-link" type="button" title="Edit keyboard shortcut" aria-label="Edit keyboard shortcut">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true" focusable="false"><polygon points="9.81,4.83 10.35,2.64 13.65,2.64 14.19,4.83 15.52,5.38 17.45,4.22 19.78,6.55 18.62,8.48 19.17,9.81 21.36,10.35 21.36,13.65 19.17,14.19 18.62,15.52 19.78,17.45 17.45,19.78 15.52,18.62 14.19,19.17 13.65,21.36 10.35,21.36 9.81,19.17 8.48,18.62 6.55,19.78 4.22,17.45 5.38,15.52 4.83,14.19 2.64,13.65 2.64,10.35 4.83,9.81 5.38,8.48 4.22,6.55 6.55,4.22 8.48,5.38"/><circle cx="12" cy="12" r="3.25"/></svg>
                </button>
                <div class="status-badge" id="status-badge">Loading</div>
            </div>
        </header>

        <main>
            <!-- Domain Info & Toggle -->
            <section class="site-control">
                <div class="domain-details">
                    <span class="label">Current Site</span>
                    <span class="value" id="current-domain">loading...</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="blocker-toggle" disabled aria-label="Enable element blocking for current site">
                    <span class="slider"></span>
                </label>
            </section>

            <!-- Main Action -->
            <button class="btn btn-primary" id="pick-element-btn" disabled>
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="9" stroke-linecap="round" stroke-linejoin="round" />
                    <circle cx="12" cy="12" r="3" stroke-linecap="round" stroke-linejoin="round" />
                    <line x1="12" y1="3" x2="12" y2="7" stroke-linecap="round" />
                    <line x1="12" y1="17" x2="12" y2="21" stroke-linecap="round" />
                    <line x1="3" y1="12" x2="7" y2="12" stroke-linecap="round" />
                    <line x1="17" y1="12" x2="21" y2="12" stroke-linecap="round" />
                </svg>
                <span>Pick Element to Block</span>
                <kbd class="shortcut-hint" id="shortcut-hint">…</kbd>
            </button>

            <section id="page-notice" hidden aria-label="Page status">
                <p id="page-message" role="status" aria-live="polite"></p>
                <button class="btn-text" id="retry-action" hidden>Retry</button>
            </section>

            <section id="recovery-notice" hidden aria-label="Rule recovery">
                <p id="recovery-message" role="status" aria-live="polite"></p>
                <button class="btn-text" id="undo-rule-action" disabled><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m9 14-5-5 5-5M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Undo</button>
            </section>

            <!-- Rules List Section -->
            <section class="rules-section" id="rules-section" hidden>
                <p id="migration-message" hidden role="status"></p>
                <div class="rules-header">
                    <h2>Saved rules on this site (<span id="rule-count">0</span>)</h2>
                    <button class="btn-text" id="clear-all-btn" disabled style="display: none;">Reset Site Rules</button>
                </div>
                <div class="rules-list-container">
                    <ul id="rules-list" class="rules-list">
                        <!-- Dynamically populated -->
                    </ul>
                    <p id="no-rules-message" class="empty-state">No custom elements blocked on this site yet.</p>
                </div>
            </section>
        </main>
    </div>
    <script src="../shared/storage.js"></script>
    <script src="../shared/tab-access.js"></script>
    <script src="metadata.js"></script>
    <script src="popup.js"></script>
</body>

</html>
